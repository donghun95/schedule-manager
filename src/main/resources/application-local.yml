app:
  security:
    csrf-enabled: false

spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  servlet:
    session:
      cookie:
        secure: false

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG